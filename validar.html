<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Presenca</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --accent:  #4f8ef7;
      --accent2: #7c3aed;
      --success: #22c55e;
      --danger:  #ef4444;
      --text:    #e8eaf0;
      --muted:   #6b7280;
      --radius:  14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 60% 40% at 20% 20%, rgba(79,142,247,.07) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── TOPO FIXO ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15,17,23,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    .topbar-fiscal {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    /* ── CONTEÚDO ── */
    .content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      animation: fadeUp .2s ease both;
    }

    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .card-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .9px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag-cache {
      background: rgba(34,197,94,.12);
      color: #86efac;
      border: 1px solid rgba(34,197,94,.2);
      border-radius: 5px;
      padding: 1px 7px;
      font-size: 10px;
      letter-spacing: .5px;
    }

    .field {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .field:last-child { border-bottom: none; padding-bottom: 0; }
    .field:first-of-type { padding-top: 0; }

    .field-label {
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 64px;
    }

    .field-value {
      font-size: 14px;
      color: var(--text);
      text-align: right;
      word-break: break-word;
      font-weight: 500;
    }

    .badge-fiscal {
      background: rgba(79,142,247,.15);
      color: #93c5fd;
      border: 1px solid rgba(79,142,247,.25);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
    }

    /* ── BOTÕES ── */
    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: .2px;
    }
    .btn:active  { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(79,142,247,.35);
    }

    .btn-novo {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      display: none; /* aparece so apos resultado */
    }

    .btn-novo svg {
      width: 18px; height: 18px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── RESULTADO ── */
    .resultado {
      border-radius: var(--radius);
      padding: 20px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      line-height: 1.6;
      display: none;
      animation: fadeUp .2s ease both;
    }
    .resultado.sucesso { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); display: block; }
    .resultado.erro    { background: rgba(239,68,68,.12);  color: #fca5a5; border: 1px solid rgba(239,68,68,.25);  display: block; }
    .resultado.info    { background: rgba(79,142,247,.12); color: #93c5fd; border: 1px solid rgba(79,142,247,.25); display: block; font-weight: 400; font-size: 14px; }

    .nome-destaque { font-size: 22px; margin-top: 10px; color: #fff; font-weight: 600; }
    .resultado small { font-size: 12px; font-weight: 400; opacity: .8; }

    /* ── SPACER para nao ficar grudado no fundo ── */
    .spacer { height: 24px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- topbar fixa -->
  <div class="topbar">
    <div style="flex:1">
      <div class="topbar-title">Validar Presenca</div>
      <div class="topbar-fiscal" id="topFiscal"></div>
    </div>
  </div>

  <!-- conteudo rolavel -->
  <div class="content">

    <!-- participante -->
    <div class="card">
      <div class="card-title">
        Participante
        <span class="tag-cache" id="tagCache" style="display:none">cache</span>
      </div>
      <div class="field"><span class="field-label">Nome</span>     <span class="field-value" id="fNome">-</span></div>
      <div class="field"><span class="field-label">E-mail</span>   <span class="field-value" id="fEmail">-</span></div>
      <div class="field"><span class="field-label">Palestra</span> <span class="field-value" id="fPalestra">-</span></div>
      <div class="field"><span class="field-label">Token</span>    <span class="field-value" id="fToken">-</span></div>
    </div>

    <!-- fiscal -->
    <div class="card">
      <div class="card-title">Fiscal</div>
      <div class="field">
        <span class="field-label">Logado como</span>
        <span class="field-value" id="fFiscal">-</span>
      </div>
    </div>

    <!-- resultado (aparece apos validar) -->
    <div class="resultado" id="resultado"></div>

    <!-- botao validar -->
    <button class="btn btn-primary" id="btnValidar" onclick="validar()" disabled>
      Validar Presenca
    </button>

    <!-- botao novo registro (aparece apos resultado) -->
    <a href="index.html" class="btn btn-novo" id="btnNovo">
      <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Escanear proximo QR Code
    </a>

    <div class="spacer"></div>

  </div>

<script>
  var APPS_URL     = "https://script.google.com/macros/s/AKfycbwgn-kasXrfTWULBUe_7chco-O9TUFjFLVtXqkfyBs8WuGHKDLX8hhiENd2r-bly6-E0A/exec";
  var KEY_EMAIL    = "fiscal_email";
  var KEY_CACHE    = "participantes_cache";
  var KEY_CACHE_DT = "participantes_cache_data";

  var params      = new URLSearchParams(window.location.search);
  var tokenGlobal = (params.get("t") || "").toUpperCase();
  var emailFiscal = params.get("f") || localStorage.getItem(KEY_EMAIL) || "";

  function dataHoje() { return new Date().toISOString().slice(0, 10); }

  function cacheValido() {
    return localStorage.getItem(KEY_CACHE_DT) === dataHoje() &&
           localStorage.getItem(KEY_CACHE);
  }

  function buscarNoCache(token) {
    try {
      var lista = JSON.parse(localStorage.getItem(KEY_CACHE) || "[]");
      for (var i = 0; i < lista.length; i++) {
        if (lista[i].token === token) return lista[i];
      }
    } catch(e) {}
    return null;
  }

  function salvarCache(lista) {
    localStorage.setItem(KEY_CACHE, JSON.stringify(lista));
    localStorage.setItem(KEY_CACHE_DT, dataHoje());
  }

  window.onload = function() {

    if (!emailFiscal) { window.location.href = "index.html"; return; }

    // topbar e fiscal
    document.getElementById("topFiscal").textContent  = emailFiscal;
    document.getElementById("fFiscal").innerHTML =
      '<span class="badge-fiscal">' + emailFiscal + '</span>';
    document.getElementById("fToken").textContent = tokenGlobal || "-";

    if (!tokenGlobal) {
      mostrarResultado({ sucesso: false, mensagem: "Token nao informado." });
      return;
    }

    // Busca no cache primeiro
    var dadosCache = buscarNoCache(tokenGlobal);
    if (dadosCache) { preencherParticipante(dadosCache, true); return; }

    // Sem cache valido: recarrega tudo
    if (!cacheValido()) {
      fetch(APPS_URL + "?action=carregarCache")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            salvarCache(data.participantes);
            var p = buscarNoCache(tokenGlobal);
            if (p) { preencherParticipante(p, true); return; }
          }
          buscarOnline();
        })
        .catch(function() { buscarOnline(); });
    } else {
      buscarOnline();
    }

  };

  function buscarOnline() {
    fetch(APPS_URL + "?action=buscarParticipante&t=" + encodeURIComponent(tokenGlobal))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.ok) { mostrarResultado({ sucesso: false, mensagem: data.mensagem }); return; }
        preencherParticipante(data.dados, false);
      })
      .catch(function() {
        mostrarResultado({ sucesso: false, mensagem: "Erro ao buscar participante." });
      });
  }

  function preencherParticipante(d, doCache) {
    document.getElementById("fNome").textContent     = d.nome;
    document.getElementById("fEmail").textContent    = d.email;
    document.getElementById("fPalestra").textContent = d.palestraNome || "-";
    if (doCache) document.getElementById("tagCache").style.display = "inline";
    document.getElementById("btnValidar").disabled = false;
  }

  function validar() {
    var btn = document.getElementById("btnValidar");
    var res = document.getElementById("resultado");

    btn.disabled = true;
    btn.textContent = "Registrando...";
    res.className = "resultado info";
    res.innerHTML = "Registrando presenca...";

    fetch(APPS_URL +
      "?action=registrarPresenca" +
      "&t=" + encodeURIComponent(tokenGlobal) +
      "&f=" + encodeURIComponent(emailFiscal))
      .then(function(r) { return r.json(); })
      .then(function(data) { mostrarResultado(data); })
      .catch(function() {
        res.className = "resultado erro";
        res.innerHTML = "Erro de comunicacao. Tente novamente.";
        btn.disabled = false;
        btn.textContent = "Validar Presenca";
      });
  }

  function mostrarResultado(data) {
    var res = document.getElementById("resultado");
    var btn = document.getElementById("btnValidar");
    var btnNovo = document.getElementById("btnNovo");

    if (data.sucesso) {
      res.className = "resultado sucesso";
      res.innerHTML = "Presenca registrada!<div class='nome-destaque'>" + (data.nome || "") + "</div>";
      btn.disabled = true;
      btn.textContent = "Presenca Registrada";
      btnNovo.style.display = "flex";
    } else if (data.jaRegistrado) {
      res.className = "resultado erro";
      res.innerHTML = "Presenca ja registrada anteriormente.";
      if (data.validadoPor) res.innerHTML += "<br><small>Validado por: " + data.validadoPor + "</small>";
      btn.disabled = true;
      btn.textContent = "Ja Registrado";
      btnNovo.style.display = "flex";
    } else {
      res.className = "resultado erro";
      res.innerHTML = data.mensagem || "Erro desconhecido.";
      btn.disabled = false;
      btn.textContent = "Validar Presenca";
    }
  }
</script>
</body>
</html>
